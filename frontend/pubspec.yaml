name: miajudai
description: "MiAjudAI - Intelligent Support App for people living alone"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0

  # State Management
  provider: ^6.1.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0

  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0

  # Calendar & Date
  table_calendar: ^3.0.9
  intl: ^0.20.2

  # Charts & Graphics
  fl_chart: ^1.2.0

  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  loading_animation_widget: ^1.2.0
  pull_to_refresh: ^2.0.0

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Environment variables
  flutter_dotenv: ^6.0.1

  # Localization
  flutter_localizations:
    sdk: flutter

  # Utilities
  uuid: ^4.0.0
  validators: ^3.0.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/.env

  # Localization
  generate: true

  # Custom Fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700

# App Icon Configuration
flutter_launcher_icons:
  image_path: "assets/images/miajudai_logo_transparent.png"
  ios: true
